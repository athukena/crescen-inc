<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crescen Inc — Panel de administrador</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --gold: #D4AF37;
    --gold-light: #E8CE7A;
    --gold-dim: #8A7530;
    --carbon: #17160F;
    --carbon-2: #211F16;
    --carbon-3: #2C2A1D;
    --line: #3A3826;
    --text: #F1EEDF;
    --text-dim: #ABA791;
    --danger: #C1543B;
    --success: #6F9E5C;
    --katun-blue: #0B4F8A;
    --katun-blue-dark: #073A66;
    --katun-blue-bg: #EAF2FB;
    --font-display: 'Fraunces', serif;
    --font-body: 'Work Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--carbon);
    color: var(--text);
    font-family: var(--font-body);
    min-height:100vh;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:32px 20px 80px;}

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:24px; margin-bottom:28px; border-bottom:1px solid var(--line);
    flex-wrap:wrap; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-logo{height:44px; width:auto; border-radius:6px;}
  .brand h1{font-family:var(--font-display); font-weight:600; font-size:26px; color:var(--gold-light);}
  .brand span{font-size:13px; color:var(--text-dim); font-family:var(--font-mono);}
  .who{display:flex; align-items:center; gap:12px; font-size:14px; color:var(--text-dim);}
  .who b{color:var(--text); font-weight:500;}
  button{font-family:var(--font-body); cursor:pointer; border:none;}
  .btn{
    background:var(--gold); color:var(--carbon); font-weight:600;
    padding:10px 18px; border-radius:6px; font-size:14px;
    transition:background .15s;
  }
  .btn:hover{background:var(--gold-light);}
  .btn-ghost{
    background:transparent; color:var(--text-dim); border:1px solid var(--line);
    padding:9px 16px; border-radius:6px; font-size:13px;
  }
  .btn-ghost:hover{color:var(--text); border-color:var(--gold-dim);}

  /* ---------- login ---------- */
  #login-screen{
    min-height:80vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; text-align:center;
  }
  #login-screen h1{font-family:var(--font-display); font-size:34px; color:var(--gold-light); font-weight:600;}
  #login-screen p{color:var(--text-dim); max-width:380px; line-height:1.6; font-size:15px;}
  #google-btn{
    display:flex; align-items:center; gap:10px; background:var(--text); color:var(--carbon);
    padding:12px 24px; border-radius:6px; font-weight:600; font-size:14px;
  }
  #google-btn:hover{background:var(--gold-light);}
  #denied-msg{color:var(--danger); font-size:14px; display:none; max-width:360px;}

  /* ---------- tabs ---------- */
  .tabs{display:flex; gap:6px; margin-bottom:24px;}
  .tab{
    padding:9px 18px; border-radius:6px; font-size:14px; color:var(--text-dim);
    background:transparent;
  }
  .tab.active{background:var(--carbon-3); color:var(--gold-light); font-weight:500;}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center;}
  input[type=text], input[type=number], select, textarea{
    background:var(--carbon-2); border:1px solid var(--line); color:var(--text);
    padding:9px 12px; border-radius:6px; font-family:var(--font-body); font-size:14px;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--gold-dim);}
  #search{flex:1; min-width:200px;}
  .count{color:var(--text-dim); font-size:13px; font-family:var(--font-mono);}
  #bulk-bar{
    background:var(--katun-blue-bg); border:1px solid var(--katun-blue); border-radius:6px;
    padding:10px 14px; margin-top:-8px;
  }
  #bulk-bar .count{color:var(--katun-blue-dark); font-weight:500;}
  #bulk-bar .btn-ghost{border-color:var(--katun-blue); color:var(--katun-blue-dark); background:#fff;}
  #bulk-bar .btn-ghost:hover{background:var(--katun-blue); color:#fff;}
  .row-check{width:16px; height:16px; cursor:pointer;}
  tr.selected-row td{background:var(--katun-blue-bg) !important; color:var(--katun-blue-dark);}
  tr.selected-row .id{color:var(--katun-blue);}

  /* ---------- pedidos ---------- */
  .order-status-select{
    font-family:var(--font-mono); font-size:12px; font-weight:600; padding:5px 8px; border-radius:5px;
    border:1px solid var(--line); cursor:pointer;
  }
  .status-realizado{background:#3A331A; color:#E8CE7A; border-color:#8A7530;}
  .status-enviado{background:#1B3A52; color:#8FC2E8; border-color:#2E6690;}
  .status-entregado{background:#1E3A24; color:#8FD19E; border-color:#2E6E3E;}
  .status-cancelado{background:#3A1E1A; color:#E08A78; border-color:#8A3A2A;}
  .attended-tag{font-size:12px; color:var(--gold-light); font-family:var(--font-mono);}
  .unattended-tag{font-size:12px; color:var(--text-dim); font-style:italic;}
  .delivery-info-box{
    background:var(--katun-blue-bg); border:1px solid var(--katun-blue); border-radius:8px;
    padding:14px 16px; margin-bottom:16px; font-size:13px; color:var(--katun-blue-dark); line-height:1.5;
  }
  .delivery-info-title{font-weight:700; margin-bottom:6px; color:var(--katun-blue-dark);}

  /* ---------- table ---------- */
  .table-wrap{border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  table{width:100%; border-collapse:collapse;}
  th{
    text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-dim); padding:12px 14px; background:var(--carbon-2); font-weight:500;
    border-bottom:1px solid var(--line);
  }
  td{padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--katun-blue-bg); color:var(--katun-blue-dark);}
tr:hover .id{color:var(--katun-blue);}
  .name-cell{max-width:340px;}
  .name-cell .id{display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:2px;}
  .price-input{width:100px; font-family:var(--font-mono); text-align:right;}
  .stock-input{width:70px; font-family:var(--font-mono); text-align:right;}
  .row-save{
    background:var(--carbon-3); color:var(--gold-light); padding:6px 12px; border-radius:5px; font-size:12px;
    opacity:0; pointer-events:none; transition:opacity .15s;
  }
  tr.dirty .row-save{opacity:1; pointer-events:auto;}
  .row-save:hover{background:var(--gold-dim); color:var(--carbon);}
  .saved-flash{color:var(--success); font-size:12px; font-family:var(--font-mono);}
  .stock-low{color:var(--danger); font-weight:600;}

  /* fila en edición: acento azul Katun sobre fondo claro, para distinguirla de un vistazo */
  tr.dirty td{
    background:var(--katun-blue-bg) !important;
    transition:background .15s;
  }
  tr.dirty td:first-child{
    box-shadow: inset 3px 0 0 var(--katun-blue);
  }
  tr.dirty .name-cell{color:var(--katun-blue-dark);}
  tr.dirty .name-cell .id{color:var(--katun-blue);}
  tr.dirty td:nth-child(2), tr.dirty td:nth-child(3){color:var(--katun-blue-dark);}
  tr.dirty .price-input, tr.dirty .stock-input{
    background:#fff; color:var(--katun-blue-dark); border-color:var(--katun-blue);
  }
  tr.dirty .row-save{
    background:var(--katun-blue); color:#fff; opacity:1; pointer-events:auto;
  }
  tr.dirty .row-save:hover{background:var(--katun-blue-dark); color:#fff;}
  tr.dirty .agotado-tag{border-color:var(--danger); color:var(--danger);}
  .agotado-tag{
    display:inline-block; font-size:11px; font-family:var(--font-mono); color:var(--danger);
    border:1px solid var(--danger); border-radius:4px; padding:1px 6px; margin-top:3px;
  }
  .vis-toggle{
    width:38px; height:22px; border-radius:11px; background:var(--carbon-3); border:1px solid var(--line);
    position:relative; cursor:pointer; display:inline-block; transition:background .15s;
  }
  .vis-toggle.on{background:var(--gold-dim);}
  .vis-toggle .knob{
    position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:var(--text-dim); transition:left .15s, background .15s;
  }
  .vis-toggle.on .knob{left:18px; background:var(--gold-light);}

  /* ---------- empty / orders placeholder ---------- */
  .empty{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }
  .empty h3{font-family:var(--font-display); color:var(--gold-light); font-size:20px; margin-bottom:8px; font-weight:600;}

  /* ---------- modal (add product) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--carbon-2); border:1px solid var(--line); border-radius:10px;
    padding:28px; max-width:560px; width:100%;
  }
  .modal h2{font-family:var(--font-display); color:var(--gold-light); font-size:20px; margin-bottom:18px; font-weight:600;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;}
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
</style>
</head>
<body>

<div id="login-screen">
  <h1>Panel Crescen Inc</h1>
  <p>Acceso solo para el equipo de Crescen. Inicia sesión con el correo de Google que fue autorizado.</p>
  <button id="google-btn" onclick="signIn()">
    Continuar con Google
  </button>
  <p id="denied-msg"></p>
</div>

<div id="app" style="display:none">
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="crescen-logo.png" alt="Crescen Inc" class="brand-logo">
        <h1>Crescen</h1>
        <span>panel de administrador</span>
      </div>
      <div class="who">
        <span><b id="who-name"></b></span>
        <button class="btn-ghost" onclick="signOut()">Cerrar sesión</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="productos" onclick="switchTab('productos')">Productos</button>
      <button class="tab" data-tab="pedidos" onclick="switchTab('pedidos')">Pedidos</button>
    </div>

    <div id="tab-productos">
      <div class="toolbar">
        <input type="text" id="search" placeholder="Buscar por nombre, referencia o categoría..." oninput="renderTable()">
        <span class="count" id="count-label"></span>
        <button class="btn" onclick="openAddModal()">+ Agregar producto</button>
      </div>

      <div class="toolbar" id="bulk-bar" style="display:none;">
        <span class="count" id="selected-count"></span>
        <button class="btn-ghost bulk-btn-hide" onclick="bulkSetVisible(false)">Ocultar seleccionados</button>
        <button class="btn-ghost bulk-btn-show" onclick="bulkSetVisible(true)">Mostrar seleccionados</button>
        <button class="btn-ghost" onclick="clearSelection()">Cancelar selección</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:36px;"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this.checked)"></th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Marca</th>
              <th style="text-align:right">Precio (MXN)</th>
              <th style="text-align:right">Existencias</th>
              <th style="text-align:center">Visible en el sitio</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-pedidos" style="display:none">
      <div class="toolbar">
        <input type="text" id="orderSearch" placeholder="Buscar por número de pedido o correo del cliente..." oninput="renderOrders()">
        <select id="orderStatusFilter" onchange="renderOrders()">
          <option value="all">Todos los estatus</option>
          <option value="realizado">Realizado</option>
          <option value="enviado">Enviado</option>
          <option value="entregado">Entregado</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <span class="count" id="orders-count-label"></span>
      </div>
      <div id="orders-list"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="order-detail-overlay">
  <div class="modal" id="order-detail-modal"></div>
</div>

<div class="modal-overlay" id="add-modal-overlay">
  <div class="modal">
    <h2>Agregar producto nuevo</h2>
    <div class="field">
      <label>Nombre del producto</label>
      <input type="text" id="new-name" placeholder="Ej. Cartucho de Tóner Negro - Katun 33207">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Categoría</label>
        <input type="text" id="new-cat" placeholder="Ej. Cartucho">
      </div>
      <div class="field">
        <label>Marca de impresora (compat_brand)</label>
        <input type="text" id="new-compat-brand" placeholder="Ej. HP">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Precio final (MXN)</label>
        <input type="number" id="new-price" step="0.01" placeholder="0.00">
      </div>
      <div class="field">
        <label>Existencias</label>
        <input type="number" id="new-stock" step="1" placeholder="0">
      </div>
    </div>
    <div class="field">
      <label>Nuestra(s) marca(s) (separadas por coma — ej. Katun, Performance)</label>
      <input type="text" id="new-brand" placeholder="Katun, Select">
    </div>
    <div class="field">
      <label>Compatible con (modelos)</label>
      <textarea id="new-compat" rows="2" placeholder="Ej. LJ P 1005, LJ P 1006"></textarea>
    </div>
    <div class="field">
      <label>Rendimiento (opcional)</label>
      <input type="text" id="new-yield" placeholder="Ej. 1,500 páginas">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAddModal()">Cancelar</button>
      <button class="btn" onclick="createProduct()">Guardar producto</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ngjlkatxypqvyvngrzof.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JcPBR-kmxmfVIgoadCGc7Q_WxDz3Iym';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentStaffName = null;
let allProducts = [];

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await handleSignedIn(session.user);
  }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) handleSignedIn(session.user);
    if (event === 'SIGNED_OUT') showLogin();
  });
}

async function signIn() {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
}

async function signOut() {
  await sb.auth.signOut();
}

async function handleSignedIn(user) {
  currentUser = user;
  // Verificar que el correo esté en la tabla staff (protegido también por RLS)
  const { data, error } = await sb.from('staff').select('email, name').eq('email', user.email).maybeSingle();

  if (error || !data) {
    document.getElementById('denied-msg').style.display = 'block';
    document.getElementById('denied-msg').textContent =
      `El correo ${user.email} no está autorizado para entrar a este panel. Pide que lo agreguen a la lista de staff.`;
    await sb.auth.signOut();
    return;
  }

  document.getElementById('who-name').textContent = data.name || user.email;
  currentStaffName = data.name || user.email;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadProducts();
}

function showLogin() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

let ordersLoaded = false;
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.getElementById('tab-productos').style.display = name === 'productos' ? 'block' : 'none';
  document.getElementById('tab-pedidos').style.display = name === 'pedidos' ? 'block' : 'none';
  if (name === 'pedidos' && !ordersLoaded) {
    ordersLoaded = true;
    loadOrders();
  }
}

let selectedIds = new Set();

/* ---------- PEDIDOS ---------- */
let allOrders = [];
const ORDER_STATUSES = ['realizado', 'enviado', 'entregado', 'cancelado'];
const ORDER_STATUS_LABELS = { realizado: 'Realizado', enviado: 'Enviado', entregado: 'Entregado', cancelado: 'Cancelado' };

async function loadOrders() {
  document.getElementById('orders-list').innerHTML = `<div class="empty">Cargando pedidos...</div>`;
  const { data, error } = await sb
    .from('orders')
    .select('*, order_items(*)')
    .order('created_at', { ascending: false });
  if (error) {
    document.getElementById('orders-list').innerHTML = `<div class="empty">Error cargando pedidos: ${escapeHtml(error.message)}</div>`;
    return;
  }
  allOrders = data || [];
  renderOrders();
}

function renderOrders() {
  const q = document.getElementById('orderSearch').value.trim().toLowerCase();
  const statusFilter = document.getElementById('orderStatusFilter').value;

  let filtered = allOrders;
  if (statusFilter !== 'all') filtered = filtered.filter(o => o.status === statusFilter);
  if (q) filtered = filtered.filter(o =>
    o.order_number.toLowerCase().includes(q) || (o.user_email || '').toLowerCase().includes(q)
  );

  document.getElementById('orders-count-label').textContent = `${filtered.length} de ${allOrders.length} pedidos`;

  const wrap = document.getElementById('orders-list');
  if (filtered.length === 0) {
    wrap.innerHTML = `<div class="empty">Sin pedidos que coincidan</div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Pedido</th>
            <th>Cliente</th>
            <th>Fecha</th>
            <th style="text-align:right">Total</th>
            <th>Estatus</th>
            <th>Atendido por</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(orderRowHTML).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function orderRowHTML(o) {
  const itemCount = (o.order_items || []).reduce((s, it) => s + it.qty, 0);
  const date = new Date(o.created_at).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
  return `
    <tr>
      <td class="name-cell">${escapeHtml(o.order_number)}<span class="id">${itemCount} producto(s)</span></td>
      <td>${escapeHtml(o.user_email)}</td>
      <td>${date}</td>
      <td style="text-align:right; font-family:var(--font-mono);">$${Number(o.total).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
      <td>
        <select class="order-status-select status-${o.status}" onchange="updateOrderStatus(${o.id}, this.value, this)">
          ${ORDER_STATUSES.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${ORDER_STATUS_LABELS[s]}</option>`).join('')}
        </select>
      </td>
      <td id="attended-cell-${o.id}">${o.attended_by_name ? `<span class="attended-tag">${escapeHtml(o.attended_by_name)}</span>` : `<span class="unattended-tag">Sin atender</span>`}</td>
      <td style="text-align:right; white-space:nowrap;">
        <button class="btn-ghost" onclick="openOrderDetail(${o.id})">Ver detalle</button>
      </td>
    </tr>
  `;
}

async function updateOrderStatus(orderId, newStatus, selectEl) {
  const prevClass = Array.from(selectEl.classList).find(c => c.startsWith('status-'));
  const { error } = await sb.from('orders').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', orderId);
  if (error) {
    alert('Error al actualizar el estatus: ' + error.message);
    selectEl.value = prevClass ? prevClass.replace('status-', '') : selectEl.value;
    return;
  }
  if (prevClass) selectEl.classList.remove(prevClass);
  selectEl.classList.add('status-' + newStatus);
  const order = allOrders.find(o => o.id === orderId);
  if (order) order.status = newStatus;
}

async function openOrderDetail(orderId) {
  const o = allOrders.find(x => x.id === orderId);
  if (!o) return;

  // Si nadie lo ha atendido, esta persona lo toma — solo la primera vez
  if (!o.attended_by_email) {
    const { data, error } = await sb.from('orders')
      .update({ attended_by_email: currentUser.email, attended_by_name: currentStaffName, attended_at: new Date().toISOString() })
      .eq('id', orderId)
      .is('attended_by_email', null)
      .select()
      .maybeSingle();
    if (!error && data) {
      o.attended_by_email = data.attended_by_email;
      o.attended_by_name = data.attended_by_name;
      o.attended_at = data.attended_at;
      const cell = document.getElementById(`attended-cell-${orderId}`);
      if (cell) cell.innerHTML = `<span class="attended-tag">${escapeHtml(o.attended_by_name)}</span>`;
    }
  }

  const items = o.order_items || [];
  const modal = document.getElementById('order-detail-modal');

  let deliveryBlock = '';
  if (o.delivery_method === 'pickup') {
    deliveryBlock = `
      <div class="delivery-info-box">
        <div class="delivery-info-title">📍 Recoge en sucursal</div>
        <div>${escapeHtml(o.pickup_branch || '—')}</div>
      </div>
    `;
  } else if (o.delivery_method === 'shipping') {
    deliveryBlock = `
      <div class="delivery-info-box">
        <div class="delivery-info-title">📦 Envío a domicilio</div>
        <div><strong>${escapeHtml(o.recipient_name || 'Sin nombre registrado')}</strong>${o.recipient_phone ? ' · ' + escapeHtml(o.recipient_phone) : ''}</div>
        <div style="margin-top:4px;">${escapeHtml(o.shipping_address || 'Sin dirección registrada')}</div>
        ${o.shipping_carrier ? `<div style="margin-top:6px; color:var(--text-dim);">Paquetería: ${escapeHtml(o.shipping_carrier.toUpperCase())}${o.shipping_days ? ` · ${o.shipping_days} día(s) hábiles` : ''} · Costo: $${Number(o.shipping_cost || 0).toLocaleString('es-MX', {minimumFractionDigits:2})}</div>` : ''}
      </div>
    `;
  }

  modal.innerHTML = `
    <h2>Pedido ${escapeHtml(o.order_number)}</h2>
    <p style="color:var(--text-dim); font-size:13px; margin-bottom:16px;">
      ${escapeHtml(o.user_email)} · ${new Date(o.created_at).toLocaleString('es-MX')}<br>
      Método de pago: ${escapeHtml(o.payment_method || '—')}<br>
      Atendido por: ${o.attended_by_name ? escapeHtml(o.attended_by_name) : 'sin atender'}
    </p>
    ${deliveryBlock}
    <div class="table-wrap">
      <table>
        <thead><tr><th>Producto</th><th style="text-align:right">Cant.</th><th style="text-align:right">Precio</th><th style="text-align:right">Subtotal</th></tr></thead>
        <tbody>
          ${items.map(it => `
            <tr>
              <td>${escapeHtml(it.product_name)}</td>
              <td style="text-align:right">${it.qty}</td>
              <td style="text-align:right; font-family:var(--font-mono);">$${Number(it.unit_price).toLocaleString('es-MX', {minimumFractionDigits:2})}</td>
              <td style="text-align:right; font-family:var(--font-mono);">$${(it.qty * it.unit_price).toLocaleString('es-MX', {minimumFractionDigits:2})}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div class="modal-actions">
      <span style="margin-right:auto; font-family:var(--font-mono); font-weight:600;">Total: $${Number(o.total).toLocaleString('es-MX', {minimumFractionDigits:2})}</span>
      <button class="btn-ghost" onclick="closeOrderDetail()">Cerrar</button>
    </div>
  `;
  document.getElementById('order-detail-overlay').classList.add('open');
}
function closeOrderDetail() {
  document.getElementById('order-detail-overlay').classList.remove('open');
}

async function loadProducts() {
  const { data, error } = await sb.from('products').select('*').order('name');
  if (error) {
    alert('Error cargando productos: ' + error.message);
    return;
  }
  allProducts = data || [];
  selectedIds.clear();
  renderTable();
}

function renderTable() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = !q ? allProducts : allProducts.filter(p =>
    (p.name || '').toLowerCase().includes(q) ||
    (p.id || '').toLowerCase().includes(q) ||
    (p.cat || '').toLowerCase().includes(q)
  );

  document.getElementById('count-label').textContent = `${filtered.length} de ${allProducts.length} productos`;

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty">Sin resultados</div></td></tr>`;
    updateBulkBar();
    return;
  }

  filtered.forEach(p => {
    const tr = document.createElement('tr');
    tr.dataset.id = p.id;
    const brandStr = Array.isArray(p.brand) ? p.brand.join(', ') : (p.brand || '');
    const isOut = (p.stock ?? 0) <= 0;
    const isVisible = p.visible !== false;
    const isChecked = selectedIds.has(p.id);
    tr.innerHTML = `
      <td><input type="checkbox" class="row-check" ${isChecked ? 'checked' : ''} onclick="toggleSelectRow('${p.id}', this.checked)"></td>
      <td class="name-cell">${escapeHtml(p.name || '')}<span class="id">${escapeHtml(p.id)}</span></td>
      <td>${escapeHtml(p.cat || '')}</td>
      <td>${escapeHtml(brandStr)}</td>
      <td style="text-align:right">
        <input type="number" class="price-input" step="0.01" value="${p.price ?? 0}" oninput="markDirty('${p.id}')">
      </td>
      <td style="text-align:right">
        <input type="number" class="stock-input" step="1" value="${p.stock ?? 0}" oninput="markDirty('${p.id}')">
        ${isOut ? '<span class="agotado-tag">Agotado</span>' : ''}
      </td>
      <td style="text-align:center">
        <span class="vis-toggle ${isVisible ? 'on' : ''}" onclick="toggleVisible('${p.id}', ${isVisible})">
          <span class="knob"></span>
        </span>
      </td>
      <td style="text-align:right; white-space:nowrap;">
        <button class="row-save" onclick="saveRow('${p.id}')">Guardar</button>
        <span class="saved-flash" id="flash-${cssEscape(p.id)}"></span>
      </td>
    `;
    if (isChecked) tr.classList.add('selected-row');
    tbody.appendChild(tr);
  });

  const selectAllBox = document.getElementById('select-all');
  selectAllBox.checked = filtered.length > 0 && filtered.every(p => selectedIds.has(p.id));
  updateBulkBar();
}

function toggleSelectRow(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  const tr = document.querySelector(`tr[data-id="${cssEscape(id)}"]`);
  if (tr) tr.classList.toggle('selected-row', checked);
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = !q ? allProducts : allProducts.filter(p =>
    (p.name || '').toLowerCase().includes(q) || (p.id || '').toLowerCase().includes(q) || (p.cat || '').toLowerCase().includes(q)
  );
  document.getElementById('select-all').checked = filtered.length > 0 && filtered.every(p => selectedIds.has(p.id));
  updateBulkBar();
}

function toggleSelectAll(checked) {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = !q ? allProducts : allProducts.filter(p =>
    (p.name || '').toLowerCase().includes(q) || (p.id || '').toLowerCase().includes(q) || (p.cat || '').toLowerCase().includes(q)
  );
  filtered.forEach(p => { if (checked) selectedIds.add(p.id); else selectedIds.delete(p.id); });
  renderTable();
}

function clearSelection() {
  selectedIds.clear();
  renderTable();
}

function updateBulkBar() {
  const bar = document.getElementById('bulk-bar');
  const n = selectedIds.size;
  if (n === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  document.getElementById('selected-count').textContent = `${n} producto${n === 1 ? '' : 's'} seleccionado${n === 1 ? '' : 's'}`;
}

async function bulkSetVisible(visible) {
  const ids = Array.from(selectedIds);
  if (ids.length === 0) return;
  const label = visible ? 'mostrar' : 'ocultar';
  if (!confirm(`¿${visible ? 'Mostrar' : 'Ocultar'} ${ids.length} producto(s) en el catálogo público?`)) return;

  const { error } = await sb.from('products').update({ visible }).in('id', ids);
  if (error) {
    alert(`Error al ${label}: ` + error.message);
    return;
  }
  ids.forEach(id => {
    const prod = allProducts.find(p => p.id === id);
    if (prod) prod.visible = visible;
  });
  selectedIds.clear();
  renderTable();
}

function markDirty(id) {
  const tr = document.querySelector(`tr[data-id="${cssEscape(id)}"]`);
  if (tr) tr.classList.add('dirty');
}

async function saveRow(id) {
  const tr = document.querySelector(`tr[data-id="${cssEscape(id)}"]`);
  const price = parseFloat(tr.querySelector('.price-input').value);
  const stock = parseFloat(tr.querySelector('.stock-input').value);

  const { error } = await sb.from('products').update({ price, stock }).eq('id', id);
  const flash = document.getElementById(`flash-${cssEscape(id)}`);

  if (error) {
    flash.style.color = 'var(--danger)';
    flash.textContent = 'Error al guardar';
    return;
  }

  flash.style.color = 'var(--success)';
  flash.textContent = 'Guardado ✓';
  setTimeout(() => { flash.textContent = ''; }, 2000);

  const prod = allProducts.find(p => p.id === id);
  if (prod) { prod.price = price; prod.stock = stock; }

  tr.classList.remove('dirty');
  const stockCell = tr.querySelector('.stock-input').parentElement;
  const existingTag = stockCell.querySelector('.agotado-tag');
  if (stock <= 0 && !existingTag) {
    stockCell.insertAdjacentHTML('beforeend', '<span class="agotado-tag">Agotado</span>');
  } else if (stock > 0 && existingTag) {
    existingTag.remove();
  }
}

async function toggleVisible(id, currentlyVisible) {
  const newVisible = !currentlyVisible;
  const { error } = await sb.from('products').update({ visible: newVisible }).eq('id', id);
  if (error) {
    alert('Error al cambiar visibilidad: ' + error.message);
    return;
  }
  const prod = allProducts.find(p => p.id === id);
  if (prod) prod.visible = newVisible;
  renderTable();
}

function openAddModal() {
  document.getElementById('add-modal-overlay').classList.add('open');
}
function closeAddModal() {
  document.getElementById('add-modal-overlay').classList.remove('open');
  ['new-name','new-cat','new-compat-brand','new-price','new-stock','new-brand','new-compat','new-yield']
    .forEach(id => document.getElementById(id).value = '');
}

async function createProduct() {
  const name = document.getElementById('new-name').value.trim();
  const cat = document.getElementById('new-cat').value.trim();
  const compat_brand = document.getElementById('new-compat-brand').value.trim();
  const price = parseFloat(document.getElementById('new-price').value) || 0;
  const stock = parseFloat(document.getElementById('new-stock').value) || 0;
  const brandRaw = document.getElementById('new-brand').value.trim();
  const compat = document.getElementById('new-compat').value.trim();
  const yield_text = document.getElementById('new-yield').value.trim() || null;

  if (!name) { alert('El producto necesita un nombre.'); return; }

  const brand = brandRaw ? brandRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
  const id = `${slugify(name)}-${Date.now().toString(36)}`;

  const { error } = await sb.from('products').insert({
    id, name, cat, compat_brand, price, stock, brand, compat, yield_text
  });

  if (error) {
    alert('Error al crear el producto: ' + error.message);
    return;
  }

  closeAddModal();
  await loadProducts();
}

function slugify(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cssEscape(s) {
  return String(s).replace(/"/g, '\\"');
}

init();
</script>
